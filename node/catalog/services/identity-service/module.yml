id: identity-service
version: 1.3.0
requires: [capability:http-api]
conflicts: []
prompts:
  - key: jwt_issuer
    type: string
    default: jloom-app
  - key: jwt_secret
    type: secret
    default: change-me-in-production-this-is-a-dev-only-default-32-chars-min
  - key: internal_service_key
    type: secret
    default: change-me-internal-service-key-dev-only
  - key: user_service_base_url
    type: string
    default: ""
mergeRecipes:
  - merges/application-yml.yml
fileTemplates:
  - src/main/java/{{package_path}}/identity/JwtIssuer.java
  - src/main/java/{{package_path}}/identity/JwksEndpoint.java
  - src/main/java/{{package_path}}/identity/IdentityController.java
  - src/main/java/{{package_path}}/identity/IdentityConfig.java
  - src/test/java/{{package_path}}/identity/IdentityServiceTest.java
  - src/test/java/{{package_path}}/identity/IdentityControllerTest.java
upgrades:
  - from: 1.0.0
    to: 1.0.1
    recipe: recipes/v1.0.0-to-v1.0.1.yml
  - from: 1.0.1
    to: 1.1.0
    recipe: recipes/v1.0.1-to-v1.1.0.yml