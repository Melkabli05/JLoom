- org.openrewrite.yaml.MergeYaml:
    key: $.jwt
    yaml: |
      secret: "change-me-in-production-this-is-a-dev-only-default-32-chars-min"
      public-paths:
        identity-service: "POST:/tokens"
    filePattern: "**/application.yml"
- org.openrewrite.yaml.MergeYaml:
    key: $.internal
    yaml: |
      service-key: "change-me-internal-service-key-dev-only"
    filePattern: "**/application.yml"
- org.openrewrite.yaml.MergeYaml:
    key: $.user-service
    yaml: |
      base-url: ""
    filePattern: "**/application.yml"
