- org.openrewrite.yaml.ChangePropertyKey:
    oldPropertyKey: identity.issuer
    newPropertyKey: jwt.issuer
    filePattern: "**/application.yml"
- org.openrewrite.yaml.ChangePropertyKey:
    oldPropertyKey: identity.token-ttl-seconds
    newPropertyKey: jwt.token-ttl-seconds
    filePattern: "**/application.yml"
