- org.openrewrite.yaml.MergeYaml:
    key: $.jwt
    yaml: |
      issuer: "{{jwt_issuer}}"
      token-ttl-seconds: 3600
      private-key: "{{jwt_private_key}}"
      public-key: "{{jwt_public_key}}"
      audience: "{{jwt_audience}}"
      public-paths:
        identity-service: "POST:/tokens"
    filePattern: "**/application.yml"
- org.openrewrite.yaml.MergeYaml:
    key: $.jwt.jwk-set-uri
    yaml: "http://localhost:8080/.well-known/jwks.json"
    filePattern: "**/application.yml"
- org.openrewrite.yaml.MergeYaml:
    key: $.internal
    yaml: |
      service-key: "{{internal_service_key}}"
    filePattern: "**/application.yml"
- org.openrewrite.yaml.MergeYaml:
    key: $.user-service
    yaml: |
      base-url: "{{user_service_base_url}}"
    filePattern: "**/application.yml"
