# mysql — Spring Data JPA + Hibernate + the MySQL JDBC driver. Sibling of postgres/h2/mariadb.
id: mysql
version: 1.0.0
requires: []
conflicts: [postgres, h2, mariadb]
provides: capability:relational-db
prompts:
  - key: db_name
    type: string
    default: app
mergeRecipes:
  - merges/gradle.yml
  - merges/application-yml.yml
fileTemplates: []
upgrades: []
