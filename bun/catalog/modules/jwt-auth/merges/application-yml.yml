# JWT-specific config lands at the root `jwt:` key (1-level path; works on fresh + existing
# projects). `jwt.jwk-set-uri` is what SecurityConfig's JwtDecoder actually validates signatures
# against — no shared secret; when identity-service is also present, it overrides this to
# self-reference its own /.well-known/jwks.json (see that module's own application-yml merge).
# No `jwt.public-paths` key is written here on purpose — this module doesn't know which
# endpoints any given service wants exposed without a token, and MergeYaml's scalar-overwrite
# behavior when the same key is set by two modules in one batch isn't something to depend on.
# SecurityConfig.java falls back to "" if no other module sets it. A module that needs a public
# endpoint adds this key via its own application-yml merge (e.g. user-service adds "POST:/users"
# for registration).
#
# No `jwt.expiration-seconds` here (an earlier version of this file set it) — nothing ever read
# it; the resource server validates whatever `exp` claim is already baked into an incoming token,
# it doesn't have its own expiration setting. The actual TTL a token is issued with is
# identity-service's own `jwt.token-ttl-seconds`, a completely separate (issuer-side) concern.
- org.openrewrite.yaml.MergeYaml:
    key: $.jwt
    yaml: |
      jwk-set-uri: "{{jwt_jwk_set_uri}}"
      issuer: jloom-app
      audience: "{{jwt_audience}}"
      cors:
        allowed-origins: "{{cors_allowed_origins}}"
    filePattern: "**/application.yml"