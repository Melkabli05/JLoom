id: jwt-auth
version: 3.1.0
requires: []
conflicts: []
provides: capability:auth
prompts:
  - key: jwt_jwk_set_uri
    type: string
    default: http://localhost:8081/.well-known/jwks.json
  - key: jwt_audience
    type: string
    default: ""
  - key: cors_allowed_origins
    type: string
    default: ""
mergeRecipes:
  - merges/gradle.yml
  - merges/application-yml.yml
fileTemplates:
  - src/main/java/{{package_path}}/infrastructure/configuration/SecurityConfig.java
  - src/main/java/{{package_path}}/infrastructure/configuration/ProblemDetailAuthenticationEntryPoint.java
  - src/main/java/{{package_path}}/presentation/exception/SecurityExceptionHandler.java
upgrades:
  - from: 3.0.0
    to: 3.1.0
    recipe: recipes/v3.0.0-to-v3.1.0.yml
