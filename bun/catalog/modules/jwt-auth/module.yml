# jwt-auth — adds Spring Security + OAuth2 Resource Server dependencies, `jwt.*` configuration,
# and a working SecurityConfig: a genuine stateless JWT bearer-token resource server (JwtDecoder
# validates against a JWK Set published by an identity provider — asymmetric, no shared secret —
# a JwtAuthenticationConverter maps a `roles` claim to granted authorities, method security is
# enabled for @PreAuthorize elsewhere). File templates and merge recipes both apply within the
# same module batch, before any Gradle/OpenRewrite step runs — see ModuleApplier — so there's no
# chicken-and-egg with the new dependencies this module also adds.
id: jwt-auth
version: 3.0.0
requires: []
conflicts: []
provides: capability:auth
prompts:
  # Points at whichever identity provider issues tokens this resource server should trust — by
  # default, jloom's own identity-service module. Override for real deployments (identity-service
  # applies its own override to self-reference — see its merges/application-yml.yml).
  - key: jwt_jwk_set_uri
    type: string
    default: http://localhost:8081/.well-known/jwks.json
mergeRecipes:
  - merges/gradle.yml
  - merges/application-yml.yml
fileTemplates:
  - src/main/java/{{package_path}}/infrastructure/configuration/SecurityConfig.java
  - src/main/java/{{package_path}}/presentation/exception/SecurityExceptionHandler.java