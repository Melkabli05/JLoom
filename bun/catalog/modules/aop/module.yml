# aop — Spring AOP via spring-boot-starter-aspectj (renamed from spring-boot-starter-aop in
# Spring Boot 4.0 — verified against the actual published Maven Central metadata, since
# spring-boot-starter-aop's last release is only a 4.0.0 milestone), wired into Spring Boot 4's
# built-in Micrometer Observation infrastructure: an ObservedAspect bean plus an abstract
# ObservedService base class. Every domain ServiceImpl that extends ObservedService gets
# per-method Timer metrics + per-method tracing spans (auto-correlated with HTTP server spans
# via the otel-tracing bridge), with automatic exception tagging — no hand-rolled aspect, no
# per-method annotations, and the same single Timer/Span per method Spring's own docs recommend.
id: aop
version: 2.0.0
requires: []
conflicts: []
provides: capability:aop
prompts: []
mergeRecipes:
  - merges/gradle.yml
fileTemplates:
  - src/main/java/{{package_path}}/infrastructure/observation/ObservedAspectConfig.java
  - src/main/java/{{package_path}}/infrastructure/observation/ObservedService.java
upgrades: []
