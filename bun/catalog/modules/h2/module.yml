# h2 — Spring Data JPA + Hibernate + an in-memory H2 database. Sibling of postgres/mysql/mariadb:
# same capability, same db_name prompt, same JPA bundling — only the driver and datasource
# differ. Intended for local development and fast test runs, not production use.
id: h2
version: 1.0.0
requires: []
conflicts: [postgres, mysql, mariadb]
provides: capability:relational-db
description: H2 (in-memory — dev/test only)
prompts:
  - key: db_name
    type: string
    default: app
mergeRecipes:
  - merges/gradle.yml
  - merges/application-yml.yml
fileTemplates: []
upgrades: []
