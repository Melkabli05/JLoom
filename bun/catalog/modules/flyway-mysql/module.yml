# flyway-mysql — MySQL/MariaDB-flavored Flyway: adds spring-boot-starter-flyway + flyway-core +
# flyway-mysql (covers both MySQL and MariaDB dialects — Flyway ships one combined artifact for
# both) + config, and drops a starter migration file. Sibling of `flyway` (which is
# postgres-specific) — pick whichever matches the relational-db module you added.
#
# spring-boot-starter-flyway is load-bearing, not decorative — same reasoning as flyway's own
# module comment: Spring Boot 4's modularized autoconfiguration moved FlywayAutoConfiguration out
# of the monolithic spring-boot-autoconfigure jar into its own module, which this starter is what
# actually pulls in — flyway-core + flyway-mysql alone compile fine but Flyway silently never runs.
id: flyway-mysql
version: 1.1.0
requires: [capability:relational-db]
conflicts: []
prompts: []
mergeRecipes:
  - merges/gradle.yml
  - merges/application-yml.yml
fileTemplates:
  - src/main/resources/db/migration/V1__init.sql
upgrades:
  - from: 1.0.0
    to: 1.1.0
    recipe: recipes/v1.0.0-to-v1.1.0.yml
