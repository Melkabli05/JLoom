id: postgres
version: 1.2.0
requires: []
conflicts: [h2, mysql, mariadb]
provides: capability:relational-db
description: PostgreSQL
prompts:
  - key: db_name
    type: string
    default: app
mergeRecipes:
  - merges/gradle.yml
  - merges/application-yml.yml
fileTemplates: []
upgrades:
  - from: 1.0.0
    to: 1.1.0
    recipe: recipes/v1.0.0-to-v1.1.0.yml
  - from: 1.1.0
    to: 1.2.0
    recipe: recipes/v1.1.0-to-v1.2.0.yml
