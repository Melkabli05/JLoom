# base — scaffolds the project via a real Spring Initializr call (see src/initializr.ts)
# rather than jloom's own hand-maintained skeleton templates. Only what Initializr doesn't
# know how to generate remains here: the ArchUnit layering-rules test file, and the
# archunit-junit5 dependency it needs (Initializr's own catalog has no ArchUnit entry).
id: base
version: 2.0.0
requires: []
conflicts: []
prompts: []
provides: capability:http-api
mergeRecipes:
  - merges/gradle.yml
scaffold: true
fileTemplates:
  - src/test/java/{{package_path}}/ArchitectureTest.java
