# ArchUnit isn't in Spring Initializr's dependency catalog, so it's added the same way any
# other module adds a dependency to an already-generated build.gradle.kts.
- org.openrewrite.gradle.AddDependency:
    groupId: com.tngtech.archunit
    artifactId: archunit-junit5
    version: 1.4.1
    configuration: testImplementation
# Production-readiness observability bundle — every generated project is scrape-ready and
# trace-ready on day 1, with zero opt-in. These four are the same set the otel-tracing module
# already pulls in (intentionally, so OpenRewrite's AddDependency dedup makes adding them
# again a no-op rather than a conflict).
- org.openrewrite.gradle.AddDependency:
    groupId: org.springframework.boot
    artifactId: spring-boot-starter-actuator
    configuration: implementation
- org.openrewrite.gradle.AddDependency:
    groupId: io.micrometer
    artifactId: micrometer-registry-prometheus
    configuration: runtimeOnly
- org.openrewrite.gradle.AddDependency:
    groupId: io.micrometer
    artifactId: micrometer-tracing-bridge-otel
    configuration: implementation
- org.openrewrite.gradle.AddDependency:
    groupId: io.opentelemetry
    artifactId: opentelemetry-exporter-otlp
    configuration: runtimeOnly
# Lombok + MapStruct for every generated project. Lombok compileOnly + annotationProcessor
# (annotation-processor-only path is the canonical pattern since Lombok is bytecode-only).
# MapStruct with lombok-mapstruct-binding so @Mapper sees Lombok-generated getters/setters
# instead of throwing "no property named X" — the binding has to come AFTER lombok's
# annotation processor in the classpath; OpenRewrite's AddDependency appends in declaration
# order, so this ordering is load-bearing.
- org.openrewrite.gradle.AddDependency:
    groupId: org.projectlombok
    artifactId: lombok
    configuration: compileOnly
- org.openrewrite.gradle.AddDependency:
    groupId: org.projectlombok
    artifactId: lombok
    configuration: annotationProcessor
- org.openrewrite.gradle.AddDependency:
    groupId: org.mapstruct
    artifactId: mapstruct
    version: 1.6.3
    configuration: implementation
- org.openrewrite.gradle.AddDependency:
    groupId: org.mapstruct
    artifactId: mapstruct-processor
    version: 1.6.3
    configuration: annotationProcessor
- org.openrewrite.gradle.AddDependency:
    groupId: org.projectlombok
    artifactId: lombok-mapstruct-binding
    version: 0.2.0
    configuration: annotationProcessor
