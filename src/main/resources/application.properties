# Spring Shell runs in interactive readline mode by default — running `jloom`
# with no args drops into a shell prompt with TAB-completion and history.
# For scripted / CI invocations, force one-shot mode via:
#   jloom --non-interactive <command>     (Spring Shell 4.x built-in flag)
#   or:  SPRING_SHELL_INTERACTIVE_ENABLED=false jloom <command>
#   or:  java -Dspring.shell.interactive.enabled=false -jar jloom.jar <command>
spring.shell.interactive.enabled=true

# Suppress the Spring Boot banner in CI / scripted use.
spring.main.banner-mode=off

# Default log level — quieter than Spring Boot's default INFO noise.
logging.level.root=WARN
logging.level.com.jloom=INFO