# Spring Shell — run as a non-interactive CLI (single command per invocation).
# Without this, Spring Shell drops CLI args and enters its interactive readline loop.
spring.shell.interactive.enabled=false

# Suppress the Spring Boot banner in CI / scripted use.
spring.main.banner-mode=off

# Default log level — quieter than Spring Boot's default INFO noise.
logging.level.root=WARN
logging.level.com.jloom=INFO